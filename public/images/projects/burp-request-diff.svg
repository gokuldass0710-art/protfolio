<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#080B10" />
  <rect x="2" y="2" width="796" height="446" fill="#0D121B" stroke="#263244" stroke-width="2" rx="8" />

  <!-- Title Badge -->
  <rect x="30" y="25" width="460" height="34" rx="4" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
  <text x="45" y="47" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">HOST HEADER RESPONSE COMPARISON (DIFF)</text>

  <!-- Left: Normal Request -->
  <rect x="30" y="80" width="355" height="330" rx="6" fill="#080B10" stroke="#00F5A0" stroke-width="1.5" />
  <rect x="30" y="80" width="355" height="30" fill="#111827" rx="6" />
  <text x="45" y="100" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">CASE A: VALID HOST HEADER</text>
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="45" y="130" fill="#38BDF8">GET / HTTP/1.1</text>
    <text x="45" y="150" fill="#00F5A0">Host: lab.target-domain.local</text>
    <text x="45" y="170" fill="#94A3B8">User-Agent: Mozilla/5.0 ...</text>

    <line x1="40" y1="190" x2="370" y2="190" stroke="#263244" stroke-width="1" />
    <text x="45" y="215" fill="#00F5A0">HTTP/1.1 200 OK</text>
    <text x="45" y="235" fill="#94A3B8">Cache-Control: public, max-age=3600</text>
    <text x="45" y="255" fill="#94A3B8">&lt;script src="https://lab.target-domain.local</text>
    <text x="45" y="275" fill="#94A3B8">/static/app.js"&gt;&lt;/script&gt;</text>

    <rect x="40" y="300" width="335" height="90" rx="4" fill="#111827" />
    <text x="50" y="325" fill="#00F5A0">Result: Normal Behavior</text>
    <text x="50" y="345" fill="#94A3B8">Absolute links rendered</text>
    <text x="50" y="365" fill="#94A3B8">with legitimate canonical host.</text>
  </g>

  <!-- Right: Injected Request -->
  <rect x="415" y="80" width="355" height="330" rx="6" fill="#080B10" stroke="#F43F5E" stroke-width="1.5" />
  <rect x="415" y="80" width="355" height="30" fill="#111827" rx="6" />
  <text x="430" y="100" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">CASE B: INJECTED HOST HEADER</text>
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="430" y="130" fill="#38BDF8">GET / HTTP/1.1</text>
    <text x="430" y="150" fill="#F43F5E">Host: cdn-evil.attacker.io</text>
    <text x="430" y="170" fill="#94A3B8">User-Agent: Mozilla/5.0 ...</text>

    <line x1="425" y1="190" x2="755" y2="190" stroke="#263244" stroke-width="1" />
    <text x="430" y="215" fill="#00F5A0">HTTP/1.1 200 OK</text>
    <text x="430" y="235" fill="#94A3B8">Cache-Control: public, max-age=3600</text>
    <text x="430" y="255" fill="#F43F5E">&lt;script src="https://cdn-evil.attacker.io</text>
    <text x="430" y="275" fill="#F43F5E">/static/app.js"&gt;&lt;/script&gt;</text>

    <rect x="425" y="300" width="335" height="90" rx="4" fill="#111827" stroke="#F43F5E" stroke-width="1" />
    <text x="435" y="325" fill="#F43F5E">Impact: Web Cache Poisoning</text>
    <text x="435" y="345" fill="#F8FAFC">If cached, all subsequent visitors load</text>
    <text x="435" y="365" fill="#F8FAFC">malicious script from attacker domain!</text>
  </g>
</svg>

