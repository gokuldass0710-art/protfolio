<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#080B10" />
  <rect x="2" y="2" width="796" height="446" fill="#0D121B" stroke="#263244" stroke-width="2" rx="8" />

  <!-- Title Badge -->
  <rect x="30" y="25" width="410" height="34" rx="4" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
  <text x="45" y="47" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">OPENVPN CLIENT-TO-SITE ARCHITECTURE</text>

  <!-- Client Zone -->
  <rect x="40" y="100" width="200" height="260" rx="6" fill="#111827" stroke="#263244" stroke-width="1.5" />
  <text x="55" y="130" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="bold">Remote Client</text>
  <text x="55" y="155" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Windows 10 Pro</text>
  <rect x="55" y="175" width="170" height="80" rx="4" fill="#080B10" stroke="#38BDF8" stroke-width="1" />
  <text x="65" y="195" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">Physical IP: 192.168.100.15</text>
  <text x="65" y="215" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">Virtual IP: 10.8.0.6</text>
  <text x="65" y="235" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">TAP/TUN TAP-Win Adapter</text>
  <text x="55" y="285" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Client Profile:</text>
  <text x="55" y="305" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">client.ovpn (PKI Certs)</text>
  <text x="55" y="325" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">MFA: PAM OTP (Trial)</text>

  <!-- Untrusted Transit WAN -->
  <g>
    <path d="M 240 210 L 530 210" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8,6" />
    <rect x="290" y="180" width="190" height="60" rx="6" fill="#111827" stroke="#00F5A0" stroke-width="1.5" />
    <text x="305" y="205" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">TLS Encrypted Tunnel</text>
    <text x="305" y="225" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10">AES-256-GCM / SHA256</text>
    <text x="305" y="255" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Port: UDP 1194</text>
  </g>

  <!-- Gateway / Protected LAN Zone -->
  <rect x="540" y="100" width="220" height="260" rx="6" fill="#111827" stroke="#00F5A0" stroke-width="1.5" />
  <text x="555" y="130" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="bold">OpenVPN Gateway</text>
  <text x="555" y="155" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Ubuntu Server 22.04 LTS</text>
  <rect x="555" y="175" width="190" height="80" rx="4" fill="#080B10" stroke="#00F5A0" stroke-width="1" />
  <text x="565" y="195" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">WAN: 192.168.100.1</text>
  <text x="565" y="215" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">VPN Subnet: 10.8.0.1/24</text>
  <text x="565" y="235" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">LAN Subnet: 172.16.0.0/24</text>
  <text x="555" y="285" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Security Features:</text>
  <text x="555" y="305" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">iptables NAT Masquerade</text>
  <text x="555" y="325" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">TLS-Auth HMAC Signing</text>
</svg>

