<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#080B10" />
  <rect x="2" y="2" width="796" height="446" fill="#0D121B" stroke="#263244" stroke-width="2" rx="8" />

  <!-- Title Badge -->
  <rect x="30" y="25" width="450" height="34" rx="4" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
  <text x="45" y="47" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">SMART HOME THREAT MODEL &amp; VLAN SEGMENTATION</text>

  <!-- Untrusted IoT Zone -->
  <rect x="30" y="85" width="220" height="320" rx="6" fill="#111827" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="45" y="115" fill="#F43F5E" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">VLAN 30: IoT Subnet (Untrusted)</text>
  <text x="45" y="135" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Subnet: 192.168.30.0/24</text>

  <rect x="45" y="155" width="190" height="60" rx="4" fill="#080B10" stroke="#263244" />
  <text x="55" y="180" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">Smart Camera / Bulb</text>
  <text x="55" y="200" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">Cleartext MQTT (TCP 1883)</text>

  <rect x="45" y="230" width="190" height="60" rx="4" fill="#080B10" stroke="#263244" />
  <text x="55" y="255" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">Smart Hub Controller</text>
  <text x="55" y="275" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">mDNS / SSDP Discovery</text>

  <rect x="45" y="305" width="190" height="80" rx="4" fill="#080B10" stroke="#F43F5E" stroke-width="1" />
  <text x="55" y="325" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">IDENTIFIED RISKS:</text>
  <text x="55" y="345" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">- No mutual TLS authentication</text>
  <text x="55" y="365" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">- Plaintext telemetry broadcast</text>

  <!-- Edge Firewall / Gateway Router -->
  <rect x="290" y="160" width="180" height="170" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="2" />
  <text x="310" y="195" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">Gateway Firewall</text>
  <text x="310" y="220" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">VLAN ACL Rules:</text>
  <text x="310" y="245" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">DENY IoT -&gt; Workstations</text>
  <text x="310" y="265" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="10">ALLOW IoT -&gt; Cloud (TLS)</text>
  <text x="310" y="285" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">DROP UPnP Inbound</text>
  <text x="310" y="305" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Stateful Inspection</text>

  <!-- Protected Workstation Zone -->
  <rect x="520" y="85" width="245" height="145" rx="6" fill="#111827" stroke="#00F5A0" stroke-width="1.5" />
  <text x="535" y="115" fill="#00F5A0" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">VLAN 10: Private Trusted LAN</text>
  <text x="535" y="140" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Workstations, NAS, Mobile</text>
  <text x="535" y="165" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">Protected from IoT lateral probes</text>
  <text x="535" y="190" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">[+] Zero direct inbound routes</text>

  <!-- Cloud Services -->
  <rect x="520" y="260" width="245" height="145" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
  <text x="535" y="290" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">Cloud Vendor Backends</text>
  <text x="535" y="315" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">MQTTS Broker / API Gateways</text>
  <text x="535" y="340" fill="#00F5A0" font-family="'JetBrains Mono', monospace" font-size="11">Requirement: Strict TLS 1.3</text>
  <text x="535" y="365" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10">Proposed: Firmware Signature Verif.</text>
</svg>

